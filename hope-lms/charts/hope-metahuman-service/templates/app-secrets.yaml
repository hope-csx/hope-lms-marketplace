{{/*
Deployment-level secrets injected as environment variables.

The API's secret-loader (apps/api/src/config/secret-loader.ts) skips a GCP
Secret Manager lookup whenever the target env var is already present, so
supplying these here transparently overrides Secret Manager for Marketplace
installs — no application code change is required.

Peppers and the CAPTCHA HMAC key are auto-generated by Marketplace
(GENERATED_PASSWORD in ../schema.yaml). Connection strings and the two internal
service keypairs are customer-supplied.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-metahuman-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ include "hope-metahuman-service.redisUrl" . | quote }}
  SESSION_PEPPER: {{ .Values.secrets.sessionPepper | quote }}
  INVITATION_PEPPER: {{ .Values.secrets.invitationPepper | quote }}
  IP_HASH_PEPPER: {{ .Values.secrets.ipHashPepper | quote }}
  # Peppers the stored hash of every tenant API key. Required by the api's
  # secret loader: omitting it sent the api to Secret Manager, which a customer
  # service account cannot read, and the pod crash-looped on PERMISSION_DENIED.
  API_KEY_SECRET_PEPPER: {{ .Values.secrets.apiKeySecretPepper | quote }}
  CAPTCHA_HMAC_KEY: {{ .Values.secrets.captchaHmacKey | quote }}
  {{- if .Values.secrets.mailSmtpPassword }}
  MAIL_SMTP_PASSWORD: {{ .Values.secrets.mailSmtpPassword | quote }}
  {{- end }}
  INTERNAL_SVC_JWT_PRIVATE_KEY: {{ .Values.secrets.internalSvcJwtPrivateKey | quote }}
  AGENT_ENGINE_CALLBACK_JWT_PUBLIC_KEY: {{ .Values.secrets.agentEngineCallbackJwtPublicKey | quote }}
  {{- if .Values.secrets.protofaceApiKey }}
  PROTOFACE_API_KEY: {{ .Values.secrets.protofaceApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.trugenApiKey }}
  TRUGEN_API_KEY: {{ .Values.secrets.trugenApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.avaturnApiToken }}
  AVATURN_API_TOKEN: {{ .Values.secrets.avaturnApiToken | quote }}
  {{- end }}
  {{- if .Values.secrets.avaturnWebhookSecret }}
  AVATURN_WEBHOOK_SECRET: {{ .Values.secrets.avaturnWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.liveAvatars.enabled }}
  LIVEKIT_API_SECRET: {{ .Values.secrets.livekitApiSecret | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-engine-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-metahuman-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ include "hope-metahuman-service.redisUrl" . | quote }}
  # Verifies inbound service tokens minted by the API (keypair 1, public half).
  INTERNAL_SVC_JWT_PUBLIC_KEY: {{ .Values.secrets.internalSvcJwtPublicKey | quote }}
  # Signs callbacks to the API (keypair 2, private half).
  API_CALLBACK_JWT_PRIVATE_KEY: {{ .Values.secrets.apiCallbackJwtPrivateKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: a2f3d-engine-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-metahuman-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_URL: {{ include "hope-metahuman-service.redisUrl" . | quote }}
  # Verifies inbound service tokens minted by the API (keypair 1, public half).
  INTERNAL_SVC_JWT_PUBLIC_KEY: {{ .Values.secrets.internalSvcJwtPublicKey | quote }}
{{- if .Values.liveAvatars.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: avatar-bridge-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-metahuman-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The bridge holds no credentials of its own. Room tokens arrive per turn from
  # the API; this key only lets the bridge establish that the caller is the API
  # (keypair 1, public half).
  INTERNAL_SVC_JWT_PUBLIC_KEY: {{ .Values.secrets.internalSvcJwtPublicKey | quote }}
{{- end }}
{{- if eq .Values.a2f3d.nimSecureMode "mtls" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nim-a2f3d-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-metahuman-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-ca.pem: {{ .Values.a2f3d.nimMtls.rootCaPem | quote }}
  client-cert.pem: {{ .Values.a2f3d.nimMtls.clientCertPem | quote }}
  client-key.pem: {{ .Values.a2f3d.nimMtls.clientKeyPem | quote }}
{{- end }}
