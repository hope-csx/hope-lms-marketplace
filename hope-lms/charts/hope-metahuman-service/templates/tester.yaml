{{/*
Post-deploy smoke test for Marketplace's automated verification.

`helm.sh/hook: test` keeps this out of customer installs entirely: the base
image's process_helm_hooks.py drops hook-annotated resources during a normal
install, and during a test deployment rewrites the annotation to
marketplace.cloud.google.com/verification so run_tester.py picks the Pod up.

It must be a Pod. run_tester.py skips every other kind and polls status.phase,
so a Job would be reported as skipped and the check would pass without ever
testing anything.

It runs the API image deliberately. Our Marketplace registry is private, so the
verification cluster cannot pull from it, whereas Marketplace re-publishes every
declared image — this one included — somewhere the cluster is entitled to. The
image already carries wget, so the checks need nothing else.

This Pod is the whole smoke test. A standalone tester image used to be published
for the same purpose, but nothing ever referenced it, so it was removed (ADR
0029).
*/}}
{{- if .Values.standalone }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke-test
  namespace: {{ .Release.Namespace }}
  labels:
    app: smoke-test
    {{- include "hope-metahuman-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
  containers:
    - name: smoke-test
      image: {{ .Values.api.image | quote }}
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          set -eu

          # The Application is already reported ready by the time this runs, but
          # Service endpoints can lag a pod becoming ready by a moment, so each
          # target gets a short retry window rather than one attempt.
          check() {
            name="$1"
            url="$2"
            i=1
            while [ "$i" -le 12 ]; do
              if wget -q -O /dev/null "$url"; then
                echo "[smoke] ${name} OK"
                return 0
              fi
              echo "[smoke] ${name} not ready yet (attempt ${i})"
              i=$((i + 1))
              sleep 5
            done
            echo "[smoke] ${name} FAILED: ${url} never responded successfully"
            return 1
          }

          # /health is the API's only unauthenticated route (the documented
          # FedRAMP IA-2 exception). The admin-web root answers a redirect to
          # the dashboard, which wget follows.
          check "api /health" "http://api.{{ .Release.Namespace }}.{{ include "hope-metahuman-service.svcDomain" . }}/health"
          check "admin-web /" "http://admin-web.{{ .Release.Namespace }}.{{ include "hope-metahuman-service.svcDomain" . }}/"

          echo "[smoke] all checks passed"
      resources:
        requests:
          cpu: '50m'
          memory: '64Mi'
        limits:
          cpu: '200m'
          memory: '128Mi'
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
{{- end }}
