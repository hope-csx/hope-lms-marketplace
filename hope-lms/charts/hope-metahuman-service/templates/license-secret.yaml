{{/*
The offline license blob, mounted into the API as HOPE_LICENSE_KEY. The API
verifies its ECDSA (ES256) signature against a public key embedded in the image
and refuses to boot when the license is missing, tampered, or expired.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: hope-metahuman-license
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-metahuman-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  HOPE_LICENSE_KEY: {{ include "hope-metahuman-service.licenseKey" . | quote }}
