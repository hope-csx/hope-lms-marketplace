{{/*
The offline license blob, mounted into the MTP api as HOPE_LICENSE_KEY. The
api verifies its ECDSA (ES256) signature against a public key embedded in the
image and refuses to boot when the license is missing, tampered, or expired.
The vendored HOPE subchart renders its own Secret (hope-metahuman-license)
from the same global value, so one pasted license unlocks both products.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: hope-lms-license
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
type: Opaque
stringData:
  HOPE_LICENSE_KEY: {{ .Values.global.license.key | quote }}
