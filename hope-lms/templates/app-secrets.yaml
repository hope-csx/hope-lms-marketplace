{{/*
MTP deployment-level secrets injected as environment variables.

Every MTP service reads its secrets from the environment first; with
SECRETS_SOURCE=env (set in each ConfigMap) the services never construct a
Secret Manager client, which the customer's service accounts could not use
anyway (ADR 0033). Peppers and service tokens are auto-generated by Marketplace
(GENERATED_PASSWORD in ../schema.yaml); the database URL and the optional mail
and bootstrap credentials are customer-supplied.

The HOPE subchart renders its own Secrets (api-secret, agent-engine-secret,
a2f3d-engine-secret, ...) — names do not collide because every MTP object is
prefixed `mtp-`.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: mtp-api-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.global.secrets.redisUrl | quote }}
  SESSION_PEPPER: {{ .Values.secrets.sessionPepper | quote }}
  INVITATION_PEPPER: {{ .Values.secrets.invitationPepper | quote }}
  IP_HASH_PEPPER: {{ .Values.secrets.ipHashPepper | quote }}
  API_KEY_SECRET_PEPPER: {{ .Values.secrets.apiKeySecretPepper | quote }}
  GATEWAY_SERVICE_TOKEN: {{ .Values.secrets.gatewayServiceToken | quote }}
  ASSESSMENT_ENGINE_TOKEN: {{ .Values.secrets.assessmentEngineToken | quote }}
  CURRICULUM_ENGINE_TOKEN: {{ .Values.secrets.curriculumEngineToken | quote }}
  {{- if .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.bootstrapOwnerPassword }}
  BOOTSTRAP_APP_OWNER_PASSWORD: {{ .Values.secrets.bootstrapOwnerPassword | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mtp-session-gateway-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The SAME value mtp-api holds: the gateway authenticates to the control
  # plane with it and makes no trust decisions of its own (architecture §6.1).
  GATEWAY_SERVICE_TOKEN: {{ .Values.secrets.gatewayServiceToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mtp-assessment-engine-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
type: Opaque
stringData:
  ASSESSMENT_ENGINE_TOKEN: {{ .Values.secrets.assessmentEngineToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mtp-curriculum-engine-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
type: Opaque
stringData:
  CURRICULUM_ENGINE_TOKEN: {{ .Values.secrets.curriculumEngineToken | quote }}
  # Client half of the Qdrant credential; the server half is qdrant-secret in
  # templates/qdrant.yaml. Both render from one value so they cannot drift.
  QDRANT_API_KEY: {{ .Values.qdrant.apiKey | quote }}
