{{/*
Deployment-level secrets injected as environment variables.

The API's secret-loader (apps/api/src/config/secret-loader.ts) skips a GCP
Secret Manager lookup whenever the target env var is already present, so
supplying these here transparently overrides Secret Manager for Marketplace
installs — no application code change is required.

Peppers and the CAPTCHA HMAC key are auto-generated by Marketplace
(GENERATED_PASSWORD in ../schema.yaml). Connection strings and the two internal
service keypairs are customer-supplied.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  SESSION_PEPPER: {{ .Values.secrets.sessionPepper | quote }}
  INVITATION_PEPPER: {{ .Values.secrets.invitationPepper | quote }}
  IP_HASH_PEPPER: {{ .Values.secrets.ipHashPepper | quote }}
  CAPTCHA_HMAC_KEY: {{ .Values.secrets.captchaHmacKey | quote }}
  INTERNAL_SVC_JWT_PRIVATE_KEY: {{ .Values.secrets.internalSvcJwtPrivateKey | quote }}
  AGENT_ENGINE_CALLBACK_JWT_PUBLIC_KEY: {{ .Values.secrets.agentEngineCallbackJwtPublicKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-engine-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  # Verifies inbound service tokens minted by the API (keypair 1, public half).
  INTERNAL_SVC_JWT_PUBLIC_KEY: {{ .Values.secrets.internalSvcJwtPublicKey | quote }}
  # Signs callbacks to the API (keypair 2, private half).
  API_CALLBACK_JWT_PRIVATE_KEY: {{ .Values.secrets.apiCallbackJwtPrivateKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: a2f3d-engine-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  # Verifies inbound service tokens minted by the API (keypair 1, public half).
  INTERNAL_SVC_JWT_PUBLIC_KEY: {{ .Values.secrets.internalSvcJwtPublicKey | quote }}
{{- if eq .Values.a2f3d.nimSecureMode "mtls" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nim-a2f3d-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-ca.pem: {{ .Values.a2f3d.nimMtls.rootCaPem | quote }}
  client-cert.pem: {{ .Values.a2f3d.nimMtls.clientCertPem | quote }}
  client-key.pem: {{ .Values.a2f3d.nimMtls.clientKeyPem | quote }}
{{- end }}
