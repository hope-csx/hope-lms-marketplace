apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtp-assessment-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app: mtp-assessment-engine
    {{- include "hope-lms.labels" . | nindent 4 }}
  {{- include "hope-lms.gsaAnnotation" .Values.serviceAccounts.assessmentEngineGsa | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtp-assessment-engine-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
data:
  APP_ENV: 'production'
  DEPLOY_ENV: {{ .Values.global.gcp.deployEnv | quote }}
  GCP_PROJECT_ID: {{ .Values.global.gcp.projectId | quote }}
  SERVICE_NAME: 'assessment-engine'
  HOST: '0.0.0.0'
  PORT: '4020'
  LOG_LEVEL: 'INFO'
  API_BASE_URL: 'http://mtp-api.{{ .Release.Namespace }}.{{ include "hope-lms.svcDomain" . }}:80'
  # One structured-output Gemini call per completed session (D9), through the
  # customer's restricted Vertex endpoint — no internet egress (§13).
  ASSESSMENT_PROVIDER: 'vertex'
  VERTEX_PROJECT: {{ .Values.global.gcp.projectId | quote }}
  VERTEX_LOCATION: {{ .Values.mtp.vertex.location | quote }}
  VERTEX_API_ENDPOINT: {{ .Values.mtp.vertex.apiEndpoint | quote }}
  VERTEX_MODEL: {{ .Values.mtp.vertex.assessmentModel | quote }}
  OTEL_SERVICE_NAME: 'assessment-engine'
---
apiVersion: v1
kind: Service
metadata:
  name: mtp-assessment-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app: mtp-assessment-engine
    {{- include "hope-lms.labels" . | nindent 4 }}
spec:
  selector:
    app: mtp-assessment-engine
  ports:
    - name: http
      port: 80
      targetPort: 4020
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtp-assessment-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app: mtp-assessment-engine
    {{- include "hope-lms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mtp.assessmentEngine.replicas }}
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: mtp-assessment-engine
  template:
    metadata:
      labels:
        app: mtp-assessment-engine
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "hope-lms.consumptionTrackingLabel" . | nindent 8 }}
    spec:
      serviceAccountName: mtp-assessment-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: assessment-engine
          image: {{ .Values.mtp.assessmentEngine.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4020
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: mtp-assessment-engine-config
            - secretRef:
                name: mtp-assessment-engine-secret
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
              ephemeral-storage: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
              ephemeral-storage: '1Gi'
          startupProbe:
            httpGet:
              path: /health
              port: 4020
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4020
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4020
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 30']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mtp-assessment-engine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mtp-assessment-engine
  minReplicas: {{ .Values.mtp.assessmentEngine.replicas }}
  maxReplicas: 10
  {{- include "hope-lms.hpaBehavior" . | nindent 2 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
