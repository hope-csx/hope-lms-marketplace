{{- include "hope-lms.requireLicense" . -}}
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
  annotations:
    kubernetes-engine.cloud.google.com/icon: >-
      data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
    marketplace.cloud.google.com/deploy-info: '{"partner_id": "cornerstonex", "product_id": "hope-lms", "partner_name": "CornerstoneX"}'
spec:
  descriptor:
    type: HOPE MTP
    version: {{ .Chart.AppVersion | quote }}
    description: >-
      HOPE MTP metahuman training platform (web, api, session-gateway,
      assessment-engine, curriculum-engine, Qdrant) bundled with the HOPE
      Metahuman Service it runs on (api, admin-web, agent-engine,
      a2f3d-engine). Requires a valid offline license and customer-provisioned
      Cloud SQL, Memorystore (Redis) and Cloud KMS resources.
    maintainers:
      - name: CornerstoneX
        url: https://www.cornerstonex.ai
    links:
      - description: Deployment & configuration guide
        url: https://www.cornerstonex.ai/hope-lms/docs/deploy-guide.html
    notes: >-
      After install, verify all pods are Ready and browse to your configured
      MTP and HOPE web URLs. Then complete the one-time tenant binding: sign in
      to the HOPE admin portal, create the organization and machine credential
      your training tenant will use, and bind it from the MTP platform console
      (deploy guide, "Connect your tenant to HOPE"). Monitor Cloud Logging for
      LICENSE_EXPIRY_WARNING entries — both APIs log an error daily once the
      license is within 30 days of expiry, and refuse to boot once expired.
  info:
    - name: MTP web URL
      value: {{ .Values.domains.appUrl | quote }}
    - name: MTP API URL
      value: {{ .Values.domains.apiUrl | quote }}
    - name: HOPE admin URL
      value: {{ .Values.hope.domains.appUrl | quote }}
    - name: HOPE API URL
      value: {{ include "hope-lms.hopeApiUrl" . | quote }}
    - name: Deployer image
      value: {{ .Values.deployerImage | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  componentKinds:
    - group: apps/v1
      kind: Deployment
    - group: apps/v1
      kind: StatefulSet
    - group: v1
      kind: Service
    - group: v1
      kind: ConfigMap
    - group: v1
      kind: Secret
    - group: v1
      kind: ServiceAccount
    - group: v1
      kind: PersistentVolumeClaim
    - group: autoscaling/v2
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io/v1
      kind: NetworkPolicy
