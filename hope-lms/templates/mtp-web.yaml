apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtp-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: mtp-web
    {{- include "hope-lms.labels" . | nindent 4 }}
  {{- include "hope-lms.gsaAnnotation" .Values.serviceAccounts.webGsa | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtp-web-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
data:
  PORT: '4000'
  NODE_ENV: 'production'
  DEPLOY_ENV: {{ .Values.global.gcp.deployEnv | quote }}
  # Browser-facing API URL. Deliberately NOT NEXT_PUBLIC_API_URL: the web image
  # is published once and reused by every Marketplace customer install, so this
  # value cannot be baked in at build time — it is injected into the page shell
  # at request time (HOPE ADR 0026 pattern).
  API_PUBLIC_URL: {{ .Values.domains.apiUrl | quote }}
  # Browser-side WebSocket endpoint for live sessions; the customer's ingress
  # routes /ws on the api host to mtp-session-gateway.
  GATEWAY_PUBLIC_WS_URL: {{ include "hope-lms.gatewayWsUrl" . | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: mtp-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: mtp-web
    {{- include "hope-lms.labels" . | nindent 4 }}
spec:
  selector:
    app: mtp-web
  ports:
    - name: http
      port: 80
      targetPort: 4000
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtp-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: mtp-web
    {{- include "hope-lms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mtp.web.replicas }}
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: mtp-web
  template:
    metadata:
      labels:
        app: mtp-web
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "hope-lms.consumptionTrackingLabel" . | nindent 8 }}
    spec:
      serviceAccountName: mtp-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Next.js standalone server writes to /tmp at runtime.
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          image: {{ .Values.mtp.web.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: mtp-web-config
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
              ephemeral-storage: '512Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
              ephemeral-storage: '2Gi'
          # '/' is a server-rendered page; the default 1 s probe timeout is not
          # enough on the 100m CPU request once a node is busy.
          startupProbe:
            httpGet:
              path: /
              port: 4000
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 30']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mtp-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hope-lms.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mtp-web
  minReplicas: {{ .Values.mtp.web.replicas }}
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
