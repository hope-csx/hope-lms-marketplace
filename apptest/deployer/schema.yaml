# Test-deployment schema overlay, baked into the deployer at
# /data-test/schema.yaml and applied by the base image's deploy_with_tests.sh
# during Marketplace's TEST_K8S_APP_FUNCTIONALITY check.
#
# Marketplace's verification harness passes only `name` and `namespace`. Every
# other required property has to resolve to something here or the deployer
# aborts in expand_config.py before it renders anything.
#
# Two constraints govern what this file may contain:
#
#   1. overlay_test_schema.py replaces each property wholesale and refuses to
#      change a property's x-google-marketplace type. Masked properties must
#      therefore stay masked, and STORAGE_CLASS stays STORAGE_CLASS.
#   2. Values declared here beat the chart's own values.yaml, because the
#      expanded schema values are passed to `helm template --values`. Anything
#      that must differ for a test deployment belongs here, not in the chart
#      overlay.
#
# These values describe a self-contained, throwaway install: in-cluster
# Postgres (two databases, one per product) and Redis (see the chart overlay),
# no Workload Identity, and unreachable KMS keys. They are never used for a
# customer deployment.
properties:
  # Any non-empty project is fine. Both APIs require it under production but
  # never have to resolve it: every secret they would look up in Secret Manager
  # is supplied directly, and MTP's services run with SECRETS_SOURCE=env.
  global.gcp.projectId:
    type: string
    default: hope-lms-apptest

  # The ephemeral dependencies the chart overlay adds to the test namespace.
  global.secrets.redisUrl:
    type: string
    default: redis://apptest-redis:6379/0
    x-google-marketplace:
      type: MASKED_FIELD

  # Substituted from the apptest_license BuildKit secret. License enforcement
  # is on for every Marketplace install and cannot be switched off from the
  # chart, so a short-lived verification license has to be baked in for the
  # automated test deployment to reach a ready state. It carries the
  # `hope-lms` audience, which both APIs accept.
  global.license.key:
    type: string
    default: __APPTEST_LICENSE_KEY__
    x-google-marketplace:
      type: MASKED_FIELD

  # ── MTP ─────────────────────────────────────────────────────────────────────
  # Ordinary strings; the verification cluster has no ingress or DNS, so these
  # only have to be well-formed absolute https URLs (the api's production
  # config rejects a plaintext API origin).
  domains.appUrl:
    type: string
    default: https://train.apptest.invalid
  domains.apiUrl:
    type: string
    default: https://api.train.apptest.invalid
  domains.cookieDomain:
    type: string
    default: apptest.invalid

  # Syntactically valid but deliberately unresolvable. The startup config
  # schema rejects empty KMS settings whenever NODE_ENV=production, while the
  # KMS client downgrades a failed key pre-warm to a warning — so a path that
  # cannot be reached satisfies both without needing a real key ring. Signing
  # a token would fail, which the smoke test does not do.
  kms.jwtKmsKeyVersion:
    type: string
    default: projects/hope-lms-apptest/locations/us/keyRings/apptest/cryptoKeys/jwt-signing/cryptoKeyVersions/1
  kms.authDataKmsKey:
    type: string
    default: projects/hope-lms-apptest/locations/us/keyRings/apptest/cryptoKeys/auth-data

  # Empty on purpose: a Workload Identity annotation naming a service account
  # that has no binding in Google's verification project would make every GCP
  # client fail slowly rather than fail fast.
  serviceAccounts.apiGsa:
    type: string
    default: ''
  serviceAccounts.assessmentEngineGsa:
    type: string
    default: ''
  serviceAccounts.curriculumEngineGsa:
    type: string
    default: ''

  secrets.databaseUrl:
    type: string
    default: postgresql://hope:apptest-not-a-secret@apptest-postgres:5432/mtp?sslmode=disable
    x-google-marketplace:
      type: MASKED_FIELD

  # The verification cluster's default class binds a small standard disk,
  # which is all the smoke test needs. Marketplace's harness may still
  # provision its own SSD class for a STORAGE_CLASS property; either binds.
  qdrant.storageClass:
    type: string
    default: standard-rwo
    x-google-marketplace:
      type: STORAGE_CLASS
      storageClass:
        type: SSD

  # ── HOPE ────────────────────────────────────────────────────────────────────
  hope.domains.appUrl:
    type: string
    default: https://metahuman.apptest.invalid
  hope.domains.jwtIssuer:
    type: string
    default: https://api.metahuman.apptest.invalid
  hope.domains.jwtAudience:
    type: string
    default: https://metahuman.apptest.invalid
  hope.domains.cookieDomain:
    type: string
    default: apptest.invalid

  hope.kms.jwtKmsKeyVersion:
    type: string
    default: projects/hope-lms-apptest/locations/us/keyRings/apptest/cryptoKeys/hope-jwt-signing/cryptoKeyVersions/1
  hope.kms.authDataKmsKey:
    type: string
    default: projects/hope-lms-apptest/locations/us/keyRings/apptest/cryptoKeys/hope-auth-data
  hope.kms.toolCredentialKmsKey:
    type: string
    default: projects/hope-lms-apptest/locations/us/keyRings/apptest/cryptoKeys/hope-tool-credentials

  hope.serviceAccounts.apiGsa:
    type: string
    default: ''
  hope.serviceAccounts.agentEngineGsa:
    type: string
    default: ''

  # A second database on the same ephemeral server, created by its init script
  # (see the chart overlay). Two migrators must never share one database.
  hope.secrets.databaseUrl:
    type: string
    default: postgresql://hope:apptest-not-a-secret@apptest-postgres:5432/hope_metahuman?sslmode=disable
    x-google-marketplace:
      type: MASKED_FIELD

  # Replaced during the deployer build with a freshly generated throwaway
  # keypair; see inject-test-keys.sh. These must be non-empty even though the
  # smoke test never exercises service-to-service calls, because HOPE's secret
  # loader treats an empty variable as absent and then fails closed on an
  # unreachable Secret Manager.
  hope.secrets.internalSvcJwtPrivateKey:
    type: string
    default: __APPTEST_INTERNAL_SVC_PRIVATE_KEY__
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.internalSvcJwtPublicKey:
    type: string
    default: __APPTEST_INTERNAL_SVC_PUBLIC_KEY__
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.agentEngineCallbackJwtPublicKey:
    type: string
    default: __APPTEST_CALLBACK_PUBLIC_KEY__
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.apiCallbackJwtPrivateKey:
    type: string
    default: __APPTEST_CALLBACK_PRIVATE_KEY__
    x-google-marketplace:
      type: MASKED_FIELD

  # No NVIDIA NIM exists in the verification cluster. The engine starts and
  # serves its health endpoint regardless; it only dials the NIM when a session
  # begins, so an unresolvable endpoint is fine here. nimSecureMode is
  # deliberately NOT overridden: it has to stay at the chart default of 'mtls',
  # because the engine rejects 'disabled' under APP_ENV=production.
  hope.a2f3d.nimUrl:
    type: string
    default: apptest-no-nim.invalid:52000
