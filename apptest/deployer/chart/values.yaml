# Chart value overrides for the automated test deployment, deep-merged over the
# production chart's values.yaml by overlay_test_files.py.
#
# Only values that are NOT Marketplace properties belong here. Anything
# declared in schema.yaml is passed to `helm template --values` from the
# expanded schema and therefore overrides this file — those go in the test
# schema overlay instead.

# One replica each. The production default of two exists to satisfy the
# availability posture of a real install; in the verification cluster it only
# doubles the scheduling footprint and the time to reach a ready state.
mtp:
  api:
    replicas: 1
  web:
    replicas: 1
  sessionGateway:
    replicas: 1
  assessmentEngine:
    replicas: 1
  curriculumEngine:
    replicas: 1
hope:
  api:
    replicas: 1
  adminWeb:
    replicas: 1
  agentEngine:
    replicas: 1
  a2f3dEngine:
    replicas: 1

# Connection details for the ephemeral dependencies in
# templates/apptest-dependencies.yaml. The services read the URLs from the test
# schema overlay; these values only configure the servers themselves, so they
# stay together in one place. `database` is the server's default database (MTP);
# `extraDatabases` are created by the init script for the other product.
apptest:
  postgres:
    image: postgres:16-alpine
    user: hope
    password: apptest-not-a-secret
    database: mtp
    extraDatabases:
      - hope_metahuman
  redis:
    image: redis:7-alpine
