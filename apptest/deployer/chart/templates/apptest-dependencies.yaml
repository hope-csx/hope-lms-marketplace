{{/*
Ephemeral Postgres and Redis for the automated test deployment only.

This file exists solely in the test chart overlay, so it is never rendered for
a customer install — those connect to Cloud SQL and Memorystore, which the
customer provisions and passes in as connection URLs.

The API cannot reach a ready state without a real database: its init container
runs the Prisma migrations and the pod does not start if they fail. Both servers
keep their data in an emptyDir, because the namespace is deleted when
verification finishes.

Images come from Docker Hub rather than our own registry on purpose. Our
Marketplace repository is private, so the verification cluster has no
credentials for it, and publishing test-only dependencies under the product
root would submit them to Marketplace's vulnerability scan as if they were part
of the product.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: apptest-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: apptest-postgres
    {{- include "hope-lms.labels" . | nindent 4 }}
spec:
  selector:
    app: apptest-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apptest-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: apptest-postgres
    {{- include "hope-lms.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apptest-postgres
  template:
    metadata:
      labels:
        app: apptest-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      volumes:
        - name: data
          emptyDir: {}
      containers:
        - name: postgres
          image: {{ .Values.apptest.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.apptest.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.apptest.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.apptest.postgres.database | quote }}
            # The image refuses to initialise into a directory it does not own,
            # so give it a subdirectory of the mount rather than the mount root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.apptest.postgres.user | quote }}
                - -d
                - {{ .Values.apptest.postgres.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: apptest-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: apptest-redis
    {{- include "hope-lms.labels" . | nindent 4 }}
spec:
  selector:
    app: apptest-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apptest-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: apptest-redis
    {{- include "hope-lms.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apptest-redis
  template:
    metadata:
      labels:
        app: apptest-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.apptest.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: '50m'
              memory: '64Mi'
            limits:
              cpu: '250m'
              memory: '256Mi'
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
