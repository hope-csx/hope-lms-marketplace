x-google-marketplace:
  # MUST be v2.
  schemaVersion: v2

  # MUST match the version of the Application custom resource object.
  applicationApiVersion: v1beta1

  # The release version. MUST match the release tag on the deployer image.
  # Kept in lockstep with hope-lms/Chart.yaml and the deployer tag by
  # scripts/sync-marketplace-version.mjs.
  publishedVersion: '0.2.1'
  publishedVersionMetadata:
    releaseNote: >-
      HOPE MTP 0.2.1 refreshes both the Metahuman Training Platform and the
      bundled HOPE Metahuman Service. It adds the current course-authoring and
      approval improvements, Deepgram Flux speech-to-text, and support for a
      customer-operated Audio2Face-3D inference server built from NVIDIA's
      open-source SDK and model weights. NVIDIA's end-of-life NIM is no longer
      required. The inference server remains a customer-supplied prerequisite
      and is not installed by this Marketplace package.
    releaseTypes:
      - Feature
    recommended: true

  # Deployer uses the Helm base image; the chart lives at
  # /data/chart/chart.tar.gz inside the deployer image. Both the archive name
  # and its inner directory name are dictated by the base image — see the
  # packaging step in Dockerfile.deployer.
  managedUpdates:
    kalmSupported: false

  # All images used by the app MUST be declared and parameterized here so
  # Marketplace can re-publish and re-tag them into the customer-visible
  # registry. The '' (empty) key is the primary image: Marketplace resolves it by
  # path convention at the product root itself, so the MTP `api` must be
  # published to that exact path with no name segment. The others are
  # additional images at sibling paths beneath it — MTP's own, the HOPE
  # Metahuman Service images (prefixed `hope-`), and the rebuilt Qdrant. See
  # "Registry layout" in README.md.
  images:
    '':
      properties:
        mtp.api.image:
          type: FULL
    web:
      properties:
        mtp.web.image:
          type: FULL
    session-gateway:
      properties:
        mtp.sessionGateway.image:
          type: FULL
    assessment-engine:
      properties:
        mtp.assessmentEngine.image:
          type: FULL
    curriculum-engine:
      properties:
        mtp.curriculumEngine.image:
          type: FULL
    qdrant:
      properties:
        qdrant.image:
          type: FULL
    hope-api:
      properties:
        hope.api.image:
          type: FULL
    hope-admin-web:
      properties:
        hope.adminWeb.image:
          type: FULL
    hope-agent-engine:
      properties:
        hope.agentEngine.image:
          type: FULL
    hope-a2f3d-engine:
      properties:
        hope.a2f3dEngine.image:
          type: FULL
    hope-avatar-bridge:
      properties:
        hope.liveAvatars.image:
          type: FULL
    # Declared so Marketplace re-publishes it with the rest of the release; the
    # chart renders no workflow-runner in 0.2 (workflowSandbox.mode is
    # `disabled` — see hope.workflowSandbox.mode below).
    hope-workflow-runner:
      properties:
        hope.workflowSandbox.image:
          type: FULL

  # The deployer service account needs no extra cluster permissions beyond the
  # default Marketplace deployer role: the chart creates only namespaced
  # resources (Deployments, a StatefulSet and its PersistentVolumeClaim,
  # Services, ConfigMaps, Secrets, ServiceAccounts, HPAs, NetworkPolicies, and
  # the Application CR). The HOPE workflow sandbox, which would need a second
  # namespace and RBAC, is not offered.
  clusterConstraints:
    resources:
      # One MTP + HOPE stateless set per node: the five MTP workloads at
      # 100m/256Mi each plus HOPE's four at 700m/1536Mi in total.
      - replicas: 2
        requests:
          cpu: 1200m
          memory: 2816Mi
        affinity:
          simpleNodeAffinity:
            type: REQUIRE_ONE_NODE_PER_REPLICA
      # The Qdrant StatefulSet.
      - replicas: 1
        requests:
          cpu: 1000m
          memory: 2Gi

properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE

  # ── Shared by both products ─────────────────────────────────────────────────
  global.gcp.projectId:
    type: string
    title: GCP project ID
    description: >-
      The GCP project ID of the tenant HOPE MTP is deployed into. Used by both
      products to resolve Cloud KMS keys and Google AI endpoints.
  global.gcp.deployEnv:
    type: string
    title: Deployment tier
    description: Deployment target tier. Keep as 'prod' for Marketplace installs.
    default: prod
    enum:
      - prod
      - staging
  global.secrets.redisUrl:
    type: string
    title: Redis (Memorystore) URL
    description: >-
      Memorystore for Redis connection URL, including any AUTH token. One
      instance serves both products (HOPE prefixes its keys).
    x-google-marketplace:
      type: MASKED_FIELD

  # ── Offline license (REQUIRED) ──────────────────────────────────────────────
  global.license.key:
    type: string
    title: HOPE MTP license
    description: >-
      The signed license blob issued to your organization by CornerstoneX. One
      license covers the training platform and the bundled HOPE Metahuman
      Service; without a valid, unexpired license neither will start.
    x-google-marketplace:
      type: MASKED_FIELD

  # ── MTP public URLs / domains ───────────────────────────────────────────────
  domains.appUrl:
    type: string
    title: MTP web app URL
    description: Absolute browser-facing URL of the training portal, e.g. https://train.agency.gov
    pattern: '^https://.+'
  domains.apiUrl:
    type: string
    title: MTP API URL
    description: >-
      Absolute public URL of the MTP api, e.g. https://api.train.agency.gov.
      Used as the JWT issuer, the OIDC callback origin and the browser API URL.
    pattern: '^https://.+'
  domains.cookieDomain:
    type: string
    title: MTP cookie domain
    description: Parent domain shared by the MTP web and API hosts, e.g. agency.gov
  domains.gatewayWsUrl:
    type: string
    title: MTP live-session WebSocket URL
    description: >-
      Browser-facing wss:// URL for live training sessions. Leave empty to use
      wss://<MTP API host>/ws — your ingress must then route /ws on the API
      host to the mtp-session-gateway Service.
    default: ''
  domains.hopeApiUrl:
    type: string
    title: HOPE API public URL (for MTP)
    description: >-
      Public URL of the bundled HOPE api as MTP tenants will reach it. Leave
      empty to use the HOPE JWT issuer below.
    default: ''
  domains.oidcPostLoginRedirect:
    type: string
    title: MTP OIDC post-login redirect
    description: URL the browser is sent to after successful SSO (optional; defaults to the web app URL).
    default: ''

  # ── MTP Cloud KMS (customer pre-provisioned, HSM-backed) ────────────────────
  kms.jwtKmsKeyVersion:
    type: string
    title: MTP JWT signing KMS key version
    description: >-
      Fully-qualified Cloud KMS cryptoKeyVersion used to sign MTP access tokens
      (projects/.../cryptoKeyVersions/N). Must be an ASYMMETRIC_SIGN key.
  kms.authDataKmsKey:
    type: string
    title: MTP auth-data KMS key
    description: >-
      Fully-qualified Cloud KMS cryptoKey used to wrap MTP TOTP secrets and
      other auth data (projects/.../cryptoKeys/auth-data). Must be ENCRYPT_DECRYPT.
  kms.curriculumDataKmsKey:
    type: string
    title: MTP curriculum-data KMS key
    description: >-
      Optional dedicated ENCRYPT_DECRYPT key for uploaded learner documents and
      their extractions. Leave empty to use the auth-data key.
    default: ''

  # ── MTP Workload Identity: customer GCP service account emails ──────────────
  serviceAccounts.apiGsa:
    type: string
    title: MTP API GCP service account
    description: Email of the GSA bound to the mtp-api ServiceAccount (needs Cloud KMS; GCS if a documents bucket is set).
  serviceAccounts.webGsa:
    type: string
    title: MTP web GCP service account
    description: Email of the GSA bound to the mtp-web ServiceAccount (optional; the portal calls no Google API).
    default: ''
  serviceAccounts.sessionGatewayGsa:
    type: string
    title: MTP session-gateway GCP service account
    description: Email of the GSA bound to the mtp-session-gateway ServiceAccount (optional).
    default: ''
  serviceAccounts.assessmentEngineGsa:
    type: string
    title: MTP assessment-engine GCP service account
    description: Email of the GSA bound to the mtp-assessment-engine ServiceAccount (needs Vertex AI).
  serviceAccounts.curriculumEngineGsa:
    type: string
    title: MTP curriculum-engine GCP service account
    description: Email of the GSA bound to the mtp-curriculum-engine ServiceAccount (needs Vertex AI; Document AI and GCS when configured).

  # ── MTP connection strings and credentials (customer-supplied) ──────────────
  secrets.databaseUrl:
    type: string
    title: MTP PostgreSQL connection URL
    description: Cloud SQL (PostgreSQL 16) connection URL for the MTP database, including credentials.
    x-google-marketplace:
      type: MASKED_FIELD
  secrets.smtpPassword:
    type: string
    title: MTP SMTP password
    description: Password / App Password for transactional mail (required when an SMTP user is set).
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD
  secrets.bootstrapOwnerPassword:
    type: string
    title: MTP bootstrap owner password
    description: Initial password for the bootstrap application owner (at least 14 characters). Optional.
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD

  # ── MTP generated secrets (auto-created by Marketplace) ─────────────────────
  secrets.sessionPepper:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true
  secrets.invitationPepper:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true
  secrets.ipHashPepper:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true
  secrets.apiKeySecretPepper:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true
  secrets.gatewayServiceToken:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true
  secrets.assessmentEngineToken:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true
  secrets.curriculumEngineToken:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true

  # ── MTP transactional mail (optional) ───────────────────────────────────────
  mail.smtpHost:
    type: string
    title: MTP SMTP host
    description: SMTP relay for invitations and password resets (STARTTLS on 587 or implicit TLS on 465). Leave empty to disable mail.
    default: ''
  mail.smtpPort:
    type: integer
    title: MTP SMTP port
    default: 587
  mail.smtpUser:
    type: string
    title: MTP SMTP user
    default: ''
  mail.from:
    type: string
    title: MTP sender address
    description: From address for transactional mail, e.g. no-reply@agency.gov.
    default: ''

  # ── MTP document-grounded curriculum (optional) ─────────────────────────────
  docai.processorId:
    type: string
    title: Document AI processor ID
    description: >-
      Form Parser processor in your project used to extract uploaded documents.
      Leave empty to use the built-in text analyzer instead of Document AI.
    default: ''
  docai.location:
    type: string
    title: Document AI location
    default: us
  storage.documentsBucket:
    type: string
    title: MTP documents bucket
    description: GCS bucket (bare name) for uploaded learner documents. Leave empty to store document bytes in the database.
    default: ''

  # ── In-cluster Qdrant vector store ──────────────────────────────────────────
  qdrant.storageClass:
    type: string
    title: Qdrant storage class
    description: StorageClass for the vector index volume. SSD-backed persistent disk is recommended.
    x-google-marketplace:
      type: STORAGE_CLASS
      storageClass:
        type: SSD
  qdrant.storageSize:
    type: string
    title: Qdrant volume size
    description: Size of the vector index volume, e.g. 20Gi.
    default: 20Gi
  qdrant.apiKey:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true

  # ── MTP feature toggles ─────────────────────────────────────────────────────
  seedOnBoot:
    type: boolean
    title: 'MTP: seed application owner on first boot'
    description: Run the idempotent bootstrap seed to create the initial MTP application owner.
    default: true

  # ═══════════════════════════════════════════════════════════════════════════
  # HOPE Metahuman Service (bundled). These map onto the vendored subchart's
  # values under the `hope.` alias. Its license, GCP project, Redis and
  # consumption-tracking label come from the shared `global.*` values above.
  # ═══════════════════════════════════════════════════════════════════════════

  # ── HOPE public URLs / domains ──────────────────────────────────────────────
  hope.domains.appUrl:
    type: string
    title: 'HOPE: admin portal URL'
    description: Absolute browser-facing URL of the HOPE admin portal, e.g. https://metahuman.agency.gov
    pattern: '^https://.+'
  hope.domains.jwtIssuer:
    type: string
    title: 'HOPE: API URL (JWT issuer)'
    description: Absolute HOPE API URL, e.g. https://api.metahuman.agency.gov. Also used as the browser API URL.
    pattern: '^https://.+'
  hope.domains.jwtAudience:
    type: string
    title: 'HOPE: JWT audience'
    description: HOPE JWT audience. Normally identical to the HOPE admin portal URL.
    pattern: '^https://.+'
  hope.domains.cookieDomain:
    type: string
    title: 'HOPE: cookie domain'
    description: Parent domain shared by the HOPE web and API hosts, e.g. agency.gov
  hope.domains.oidcOktaRedirectUri:
    type: string
    title: 'HOPE: OIDC redirect URI'
    description: Platform-wide OIDC callback URL registered with your IdP (optional; only if using SSO for HOPE).
    default: ''
  hope.domains.oidcOktaPostLoginRedirect:
    type: string
    title: 'HOPE: OIDC post-login redirect'
    description: URL the browser is sent to after successful SSO (optional; defaults to the HOPE admin portal URL).
    default: ''

  # ── HOPE Cloud KMS (customer pre-provisioned, HSM-backed) ───────────────────
  hope.kms.jwtKmsKeyVersion:
    type: string
    title: 'HOPE: JWT signing KMS key version'
    description: Fully-qualified Cloud KMS cryptoKeyVersion used to sign HOPE access tokens. Must be an ASYMMETRIC_SIGN key.
  hope.kms.authDataKmsKey:
    type: string
    title: 'HOPE: auth-data KMS key'
    description: Fully-qualified Cloud KMS cryptoKey used to wrap HOPE TOTP secrets and auth data. Must be ENCRYPT_DECRYPT.
  hope.kms.toolCredentialKmsKey:
    type: string
    title: 'HOPE: tool-credential KMS key'
    description: >-
      Fully-qualified Cloud KMS cryptoKey used to wrap tenant-supplied tool
      credentials. Must differ from the auth-data key so a tenant credential
      can be revoked without invalidating live sessions.
  # One key per data domain; the HOPE api validates all of them at boot and
  # refuses to start without any one of them (SC-12). They may share a key ring.
  hope.kms.workflowSigningKmsKeyVersion:
    type: string
    title: 'HOPE: workflow-signing KMS key version'
    description: >-
      Fully-qualified Cloud KMS cryptoKeyVersion used to sign published workflow
      definitions. Must be an ASYMMETRIC_SIGN key.
  hope.kms.guardrailDataKmsKey:
    type: string
    title: 'HOPE: guardrail-data KMS key'
    description: Fully-qualified ENCRYPT_DECRYPT cryptoKey wrapping retained guardrail excerpts.
  hope.kms.webhookSecretKmsKey:
    type: string
    title: 'HOPE: webhook-secret KMS key'
    description: Fully-qualified ENCRYPT_DECRYPT cryptoKey wrapping tenant webhook signing secrets.
  hope.kms.conversationDataKmsKey:
    type: string
    title: 'HOPE: conversation-data KMS key'
    description: Fully-qualified ENCRYPT_DECRYPT cryptoKey wrapping stored conversation content.
  hope.kms.workflowLogDataKmsKey:
    type: string
    title: 'HOPE: workflow-log KMS key'
    description: Fully-qualified ENCRYPT_DECRYPT cryptoKey wrapping workflow execution logs.

  # ── HOPE transactional mail (REQUIRED) ──────────────────────────────────────
  # The HOPE api relays invitations and password resets, and refuses to start a
  # prod deployment on the log transport, which would write single-use
  # invitation tokens into the application log.
  hope.mail.smtpHost:
    type: string
    title: 'HOPE: SMTP relay host'
    description: Relay for HOPE invitations and password resets, e.g. smtp.agency.gov.
  hope.mail.smtpPort:
    type: integer
    title: 'HOPE: SMTP port'
    description: 587 for STARTTLS, 465 for implicit TLS.
    default: 587
  hope.mail.smtpUser:
    type: string
    title: 'HOPE: SMTP user'
    description: Leave empty for an IP-authorised relay; when set, supply the password below.
    default: ''
  hope.mail.fromAddress:
    type: string
    title: 'HOPE: sender address'
    description: >-
      Envelope and header From address for HOPE mail, e.g. no-reply@agency.gov.
      Must be a domain your relay is authorised to send for.
  hope.mail.fromName:
    type: string
    title: 'HOPE: sender display name'
    default: HOPE Metahuman Service
  hope.secrets.mailSmtpPassword:
    type: string
    title: 'HOPE: SMTP password'
    description: Required when a HOPE SMTP user is set.
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD

  # ── HOPE Workload Identity: customer GCP service account emails ─────────────
  hope.serviceAccounts.apiGsa:
    type: string
    title: 'HOPE: API GCP service account'
    description: Email of the GSA bound to the HOPE api ServiceAccount (needs Cloud KMS).
  hope.serviceAccounts.adminWebGsa:
    type: string
    title: 'HOPE: admin-web GCP service account'
    description: Email of the GSA bound to the HOPE admin-web ServiceAccount (optional).
    default: ''
  hope.serviceAccounts.agentEngineGsa:
    type: string
    title: 'HOPE: agent-engine GCP service account'
    description: Email of the GSA bound to the HOPE agent-engine ServiceAccount (needs Vertex AI).
  hope.serviceAccounts.a2f3dEngineGsa:
    type: string
    title: 'HOPE: A2F-3D engine GCP service account'
    description: Email of the GSA bound to the HOPE a2f3d-engine ServiceAccount (optional).
    default: ''

  # ── HOPE connection strings and credentials (customer-supplied) ─────────────
  hope.secrets.databaseUrl:
    type: string
    title: 'HOPE: PostgreSQL connection URL'
    description: >-
      Cloud SQL (PostgreSQL 16) connection URL for the HOPE database, including
      credentials. Use a separate database from the MTP one (the same instance
      is fine).
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.internalSvcJwtPrivateKey:
    type: string
    title: 'HOPE: internal service JWT private key (PEM)'
    description: RS256 private key the HOPE api uses to sign internal service-to-service tokens.
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.internalSvcJwtPublicKey:
    type: string
    title: 'HOPE: internal service JWT public key (PEM)'
    description: Matching RS256 public key the HOPE engines use to verify api tokens.
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.agentEngineCallbackJwtPublicKey:
    type: string
    title: 'HOPE: agent-engine callback public key (PEM)'
    description: RS256 public key the HOPE api uses to verify callbacks from the agent-engine.
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.apiCallbackJwtPrivateKey:
    type: string
    title: 'HOPE: agent-engine callback private key (PEM)'
    description: Matching RS256 private key the HOPE agent-engine uses to sign callbacks to the api.
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.protofaceApiKey:
    type: string
    title: 'HOPE: Premium avatar provider API key'
    description: Optional. Enables the Premium live-video avatar tier and the custom-avatar builder.
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.trugenApiKey:
    type: string
    title: 'HOPE: Ultra Premium avatar provider API key'
    description: Optional. Enables the Ultra Premium live-video avatar tier.
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.avaturnApiToken:
    type: string
    title: 'HOPE: Standard 3D avatar creator token'
    description: Optional. Enables the self-service Standard 3D avatar builder.
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD
  hope.secrets.avaturnWebhookSecret:
    type: string
    title: 'HOPE: avatar creator webhook secret'
    description: Optional. Signing secret (whsec_...) for the avatar creator's build notifications.
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD

  # ── HOPE generated secrets (auto-created by Marketplace) ────────────────────
  hope.secrets.sessionPepper:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true
  hope.secrets.invitationPepper:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true
  hope.secrets.ipHashPepper:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true
  hope.secrets.apiKeySecretPepper:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true
  hope.secrets.captchaHmacKey:
    type: string
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        base64: true

  # ── HOPE Audio2Face-3D inference server (customer-supplied) ────────────────
  hope.a2f3d.nimUrl:
    type: string
    title: 'HOPE: Audio2Face-3D endpoint'
    description: gRPC endpoint of your customer-operated Audio2Face-3D inference server. NVIDIA's NIM is end-of-life; use a server built from the open-source SDK or another server implementing the same A2FControllerService contract. The server is not shipped or managed by this app.
    default: nim-a2f3d.hope-metahuman.svc.cluster.local:52000
  # 'disabled' is deliberately not offered: the engine runs with
  # APP_ENV=production and refuses an unauthenticated inference connection there.
  hope.a2f3d.nimSecureMode:
    type: string
    title: 'HOPE: Audio2Face-3D transport security'
    description: Authenticate to the Audio2Face-3D inference server with client certificates. Supply the certificates below.
    default: mtls
    enum:
      - mtls
  hope.a2f3d.nimMtls.rootCaPem:
    type: string
    title: 'HOPE: Audio2Face-3D root CA certificate (PEM)'
    description: CA certificate that signed your inference server certificate. Optional until the avatar tier is used.
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD
  hope.a2f3d.nimMtls.clientCertPem:
    type: string
    title: 'HOPE: Audio2Face-3D client certificate (PEM)'
    description: Client certificate the avatar engine presents to your inference server.
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD
  hope.a2f3d.nimMtls.clientKeyPem:
    type: string
    title: 'HOPE: Audio2Face-3D client private key (PEM)'
    description: Private key for the client certificate above.
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD

  # ── HOPE live Premium avatars (optional; needs a customer LiveKit) ──────────
  hope.liveAvatars.enabled:
    type: boolean
    title: 'HOPE: enable live Premium avatars'
    description: Deploy the avatar bridge and connect to your own LiveKit media server for live-video avatar tiers.
    default: false
  hope.liveAvatars.signalUrl:
    type: string
    title: 'HOPE: LiveKit signalling URL'
    description: Browser-facing wss:// URL of your LiveKit deployment. Required when live avatars are enabled.
    default: ''
  hope.liveAvatars.apiKey:
    type: string
    title: 'HOPE: LiveKit API key'
    description: Key identifier half of the LiveKit API key pair (not a secret).
    default: ''
  hope.secrets.livekitApiSecret:
    type: string
    title: 'HOPE: LiveKit API secret'
    description: Secret half of the LiveKit API key pair. Required when live avatars are enabled.
    default: ''
    x-google-marketplace:
      type: MASKED_FIELD

  # ── HOPE workflow sandbox ───────────────────────────────────────────────────
  # Only `disabled` is offered in this release. The gVisor sandbox for
  # tenant-authored code creates its own Namespace and RBAC, which the
  # Marketplace deployer cannot apply (it applies every resource into the
  # release namespace). Declarative workflows run unaffected; a `code` node
  # fails with SANDBOX_UNAVAILABLE.
  hope.workflowSandbox.mode:
    type: string
    title: 'HOPE: workflow code sandbox'
    description: Tenant-authored code execution is not available in this release.
    default: disabled
    enum:
      - disabled

  # ── HOPE feature toggles ────────────────────────────────────────────────────
  hope.seedOnBoot:
    type: boolean
    title: 'HOPE: seed application owner on first boot'
    description: Run the idempotent bootstrap seed to create the initial HOPE application owner.
    default: true

